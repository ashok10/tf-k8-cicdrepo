name: Terraform Apply & Deploy

on:
  push:
    branches: 
    - main

jobs:
    terraform-apply:
      name: Terraform Apply
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4


        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v2
          with:
            terraform_version: 1.5.7
 

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v2
          with:
           aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
           aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
           aws-region: ${{ secrets.AWS_REGION }}


        - name: Terraform Init
          working-directory: terraform
          run: terraform init -input=false


        - name: Terraform Apply
          working-directory: terraform
          run: terraform apply -input=false -auto-approve


        - name: Get cluster name output
          id: outputs
          working-directory: terraform
          run: |
            echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT
            echo "cluster_region=$(terraform output -raw region)" >> $GITHUB_OUTPUT


    deploy-helm:
        name: Deploy Helm to EKS
        runs-on: ubuntu-latest
        needs: terraform-apply

        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v2
          with:
           aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
           aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
           aws-region: ${{ secrets.AWS_REGION }}


        - name: Setup Kubectl
          uses: azure/setup-kubectl@v3


        - name: Setup Helm
          uses: azure/setup-helm@v3


        - name: Update kubeconfig for EKS
          run: |
            aws eks update-kubeconfig --name ${{ needs.terraform-apply.outputs.cluster_name }} --region ${{ needs.terraform-apply.outputs.cluster_region }}


        - name: Wait for nodes ready
          run: |
            kubectl wait --for=condition=Ready node --all --timeout=10m


        - name: Deploy NGINX Ingress Helm chart
          working-directory: terraform/helm-values
          run: |
            helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
            helm repo update
            helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx -f nginx-values.yaml --namespace ingress-nginx --create-namespace


        - name: Deploy sample app via Helm (optional)
          working-directory: k8s/sample-app
          run: |
            helm upgrade --install sample-app . --namespace default --create-namespace